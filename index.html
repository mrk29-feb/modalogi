<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modalogi: Clear plans, clearer numbers</title>
<meta name="description" content="Modalogi: rencana keuangan dan kanvas model bisnis untuk usaha syariah dan konvensional. © 2026 mrk29">
<meta name="author" content="mrk29"><meta name="theme-color" content="#1F5FD6">
<link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#FAF6EF;--card:#FFFDF8;--line:#E8E0D2;--line2:#D9CFBC;--ink:#14213D;--mut:#6B6A66;--pri:#1F5FD6;--pri-d:#1749A8;--pri-t:#E7EEFB;--pos:#12A879;--pos-t:#DFF4EC;--acc:#F2B33D;--acc-t:#FCF0D6;--neg:#C8553D;--neg-t:#F7E3DD;--band:#1F5FD6;--onband:#fff;--onband2:#DCE7FB;--r:14px;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:500;line-height:1.25;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,38px)}h2{font-size:22px}h3{font-size:17px}h4{font-size:15px}
p{margin:0}
a{color:var(--pri)}
.muted{color:var(--mut)}.small{font-size:13px}.xs{font-size:12px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
button{font-family:inherit;font-size:14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(31,95,214,.35);outline-offset:1px}
/* header */
.hd{position:relative;background:var(--band);color:var(--onband);overflow:hidden}
.hd .pat{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hd .in{position:relative;display:flex;align-items:center;gap:14px;padding:14px 20px;flex-wrap:wrap}
.lc{background:#FAF6EF;border-radius:10px;padding:5px 8px;display:flex;align-items:center;flex:none}
.lc img{height:28px;width:auto;display:block}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;border:0;background:none;padding:0;text-align:left}
.brand b{font-size:19px;font-weight:500;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--onband2);display:block}
nav.menu{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.menu button{background:transparent;color:var(--onband);border:1px solid transparent;border-radius:999px;padding:7px 14px}
nav.menu button:hover{background:rgba(255,255,255,.14)}
nav.menu button.on{background:#fff;color:var(--pri-d);font-weight:500}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.55);color:#fff;white-space:nowrap}
/* footer */
.ft{background:var(--band);color:var(--onband2);margin-top:56px;font-size:13px}
.ft .in{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:18px 20px}
.ft .lc{padding:3px 6px;border-radius:8px}.ft .lc img{height:20px}
.ft b{color:#fff;font-weight:500}.ft a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.5)}
.ft .links{margin-left:auto}
/* layout */
main{padding:28px 0 0}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card.tight{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.af{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.stack>*+*{margin-top:14px}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#fff;border-color:#BFB39B}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--pri)}
.btn.danger{color:var(--neg)}
.btn[aria-disabled=true]{opacity:.55}
/* hero */
.hero{padding:30px 0 6px}
.hero p.lead{font-size:18px;color:var(--mut);max-width:640px;margin-top:12px}
.path{display:flex;flex-direction:column;gap:10px;align-items:flex-start;height:100%}
.path .ic{width:42px;height:42px;border-radius:12px;background:var(--pri-t);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:22px}
.path.soon .ic{background:var(--soft);background:#F1EBDD;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--acc-t);color:#7A5200;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--pri);color:var(--pri)}
/* stepper */
.stepper{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.stepper button{flex:1 0 auto;min-width:150px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;color:var(--ink)}
.stepper .n{width:26px;height:26px;border-radius:50%;background:#EFE8DA;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex:none}
.stepper button.on{border-color:var(--pri);background:var(--pri-t)}
.stepper button.on .n{background:var(--pri);color:#fff}
.stepper button.done .n{background:var(--pos);color:#fff}
.stepper small{display:block;color:var(--mut);font-size:12px;line-height:1.2}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.side{position:sticky;top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:21px;font-weight:500;line-height:1.25;margin-top:2px}.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.sidekpi{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sidekpi:last-child{border:0}
.sidekpi b{font-weight:500;text-align:right}
.mobbar{display:none}
/* form */
label.f{display:block}
label.f>span.t{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-height:40px}
textarea{resize:vertical;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:#BFB39B}
.inp{position:relative}
.inp .pre,.inp .suf{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;color:var(--mut);pointer-events:none}
.inp .pre{left:12px}.inp .suf{right:12px}
.inp.hp input{padding-left:38px}.inp.hs input{padding-right:46px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:8px 16px;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--pri);color:#fff}
.opt{border:1px solid var(--line2);border-radius:12px;background:#fff;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:flex-start;color:var(--ink);width:100%}
.opt:hover{border-color:var(--pri)}
.opt.on{border-color:var(--pri);background:var(--pri-t);box-shadow:0 0 0 1px var(--pri) inset}
.opt .ic{font-size:22px;color:var(--pri);flex:none;margin-top:1px}
.sec{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px 20px}
.sec>h3{margin-bottom:4px}
.sec>.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.itemrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 34px;gap:8px;align-items:center;margin-bottom:8px}
.itemrow.w4{grid-template-columns:minmax(0,1fr) 140px 110px 34px}
.itemrow.w5{grid-template-columns:minmax(0,1.2fr) 140px 150px 150px 34px}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;height:34px;width:34px;color:var(--mut);display:flex;align-items:center;justify-content:center}
.x:hover{color:var(--neg);border-color:var(--neg)}
.pcard{border:1px solid var(--line2);border-radius:var(--r);background:#FFFEFB;padding:16px;margin-bottom:12px}
.pcard>.ph{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.pcard>.ph .num{width:28px;height:28px;border-radius:8px;background:var(--pri);color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none}
.grp{margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px}
.grp h4{font-size:13px;color:var(--mut);font-weight:500;margin-bottom:8px}
.sumline{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--pri-t);font-size:14px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.tog>.q{flex:1}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:#CFC6B2;border-radius:999px;transition:.15s}
.sw i:after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--pri)}.sw input:checked+i:after{left:21px}
.sw input:focus-visible+i{outline:3px solid rgba(31,95,214,.35)}
.qbody{padding:2px 0 14px 0;margin-left:0}
.note{border-radius:10px;padding:10px 14px;font-size:13px;background:var(--acc-t);color:#5A3E00}
.note.pri{background:var(--pri-t);color:var(--pri-d)}
.note.bad{background:var(--neg-t);color:#7E2D1A}
.note.ok{background:var(--pos-t);color:#0B6B4F}
.note ul{margin:6px 0 0;padding-left:18px}
/* verdict */
.verdict{border-radius:var(--r);padding:18px 20px;display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line)}
.verdict .vi{font-size:30px;flex:none;line-height:1}
.verdict.ok{background:var(--pos-t);border-color:#B9E3D3}.verdict.ok .vi{color:var(--pos)}
.verdict.mid{background:var(--acc-t);border-color:#F1D79B}.verdict.mid .vi{color:#B07A00}
.verdict.bad{background:var(--neg-t);border-color:#EBC3B8}.verdict.bad .vi{color:var(--neg)}
.verdict.isi{background:var(--pri-t);border-color:#C5D6F3}.verdict.isi .vi{color:var(--pri)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;padding:3px 11px;border-radius:999px}
.pill.ok{background:var(--pos-t);color:#0B6B4F}.pill.mid{background:var(--acc-t);color:#7A5200}.pill.bad{background:var(--neg-t);color:#7E2D1A}.pill.isi{background:var(--pri-t);color:var(--pri-d)}
/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 16px}
.tabs button{border:0;background:transparent;padding:10px 14px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:210px}
thead th{background:#F5EFE2;font-weight:500;position:sticky;top:0}
thead th:first-child{background:#F5EFE2;z-index:2}
tr.tot td{font-weight:500;background:#FBF7EE}
tr.tot td:first-child{background:#FBF7EE}
tr.trs td{background:#F5EFE2;font-weight:500;text-align:left;color:var(--mut);font-size:12px}
td.neg{color:var(--neg)}
tbody tr:last-child td{border-bottom:0}
.heat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.hc{text-align:center}.hb{height:30px;border-radius:6px}.hl{font-size:12px;font-weight:500;margin-top:2px}.hm{font-size:10px;color:var(--mut);line-height:1.2;min-height:24px}
.scn{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}
.scn.mid{border:2px solid var(--pri)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:50;max-width:92vw;display:none}
.toast.on{display:block}
/* kanvas */
.cv{display:grid;gap:8px}
.cv .box{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.cv .box h4{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:2px}
.cv .box .no{background:var(--pri);color:#fff;border-radius:6px;font-size:11px;padding:1px 7px;font-weight:500;flex:none}
.cv .box .eq{font-size:11px;color:var(--mut);margin-bottom:6px}
.cv textarea{border:1px solid var(--line);font-size:13px;min-height:84px;flex:1;background:#FFFEFB}
.bmc{grid-template-columns:repeat(10,minmax(0,1fr));grid-auto-rows:minmax(150px,auto)}
.kub{grid-template-columns:repeat(4,minmax(0,1fr))}
/* misc */
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sticky-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.hide{display:none!important}
.tbl2 td,.tbl2 th{text-align:left;white-space:normal}.tbl2 td:first-child,.tbl2 th:first-child{position:static;min-width:0}
@media (max-width:980px){
 .work{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 .mobbar{display:flex;position:sticky;bottom:0;z-index:10;background:var(--card);border:1px solid var(--line2);border-radius:14px;margin-top:14px;padding:10px 14px;gap:14px;justify-content:space-between;align-items:center;box-shadow:0 -6px 18px rgba(20,33,61,.08)}
 .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bmc{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto}.bmc .box{grid-column:auto!important;grid-row:auto!important}
 .kub{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
 .g2,.g3,.g4,.g5,.kub,.bmc{grid-template-columns:minmax(0,1fr)}
 .itemrow,.itemrow.w4,.itemrow.w5{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
 .itemrow>:first-child{grid-column:1/-1}.itemrow>:nth-child(2){grid-column:1/2}.itemrow.w5>:nth-child(4){grid-column:1/3}.itemrow>:last-child{grid-column:3}
 nav.menu{margin-left:0;width:100%}
 .heat{grid-template-columns:repeat(6,minmax(0,1fr))}
 .hd .in{padding:12px 14px}.wrap{padding:0 14px}
}

.chip.on{background:var(--pri-t);border-color:var(--pri);color:var(--pri-d)}
.drop{width:100%;border:2px dashed var(--line2);border-radius:12px;padding:18px 12px;display:flex;gap:8px;align-items:center;justify-content:center;text-align:center;color:var(--mut);cursor:pointer;font-size:14px;background:#FFFEFB}
.drop:hover,.drop.on{border-color:var(--pri);color:var(--pri);background:var(--pri-t)}
.tplform{width:100%}
.tplform .grid{gap:10px}
.tplform .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.wordmark{font-weight:800;letter-spacing:.16em;font-size:21px;line-height:1.1;display:block;text-transform:uppercase}
.wordmark i{font-style:normal;text-shadow:0 1px 0 rgba(10,30,90,.35)}
.tagline{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;font-size:14px;color:#E4EDFF;letter-spacing:.01em;display:block;margin-top:1px}
.ft .in{padding:18px 20px}
.ft .lc{padding:4px 7px;border-radius:9px}.ft .lc img{height:30px}
.ft .fb{display:flex;flex-direction:column;line-height:1.35}
.ft{position:relative;overflow:hidden}
.ft .pat{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ft .in{position:relative}
.hd .brand>span:last-child{display:block}
.brand .wordmark{font-size:25px;font-weight:800;letter-spacing:.17em;line-height:1.05;display:block}
.brand .tagline{font-size:14.5px;color:#E4EDFF;margin-top:2px}
@media (max-width:620px){.brand .wordmark{font-size:21px;letter-spacing:.14em}.brand .tagline{font-size:13px}}
.pat.p-star{display:none}body[data-mode=syariah] .p-star{display:block}body[data-mode=syariah] .p-dot{display:none}@media (max-width:980px){.bmc .box{grid-column:auto!important;grid-row:auto!important}}</style></head>
<body data-mode="konvensional">
<header class="hd"><svg class="pat p-dot" aria-hidden="true"><defs><pattern id="pdh" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#fff" fill-opacity=".14"/></pattern></defs><rect width="100%" height="100%" fill="url(#pdh)"/></svg><svg class="pat p-star" aria-hidden="true"><defs><pattern id="psh" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 6l5.5 12.5L47 14l-4.5 13.5L56 28l-13.5 1.5L47 42l-13.5-4.5L28 50l-5.5-12.5L9 42l4.5-12.5L0 28l13.5-1.5L9 14l13.5 4.5z" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#psh)"/></svg><div class="in wrap">
<button class="brand" id="brandBtn" type="button" aria-label="Modalogi, ke Beranda"><span class="lc"><img src="assets/modalogi-icon.png" alt="" width="40" height="28"></span><span><span class="wordmark" aria-hidden="true"><i style="color:#FFFFFF">M</i><i style="color:#FFD36E">O</i><i style="color:#8CF5D0">D</i><i style="color:#C9E0FF">A</i><i style="color:#FFB4A2">L</i><i style="color:#FFD36E">O</i><i style="color:#8CF5D0">G</i><i style="color:#FFFFFF">I</i></span><span class="tagline">Clear plans, clearer numbers.</span></span></button>
<nav class="menu" aria-label="Menu utama"><button data-v="beranda" type="button">Beranda</button><button data-v="rencana" type="button">Rencana keuangan</button><button data-v="kanvas" type="button">Kanvas</button><button data-v="tentang" type="button">Tentang</button></nav>

<script>(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.ModalogiEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var LEVELS = ['Puncak Terbesar', 'Puncak Besar', 'Puncak Sedang', 'Baseline Harian', 'Rawan Lesu'];
  var DEF_REF = {
    tanggalData: 'Okt 2026',
    inflasiUmum: 0.033,
    inflasiPangan: 0.042,
    hargaNaik: null,
    pph: 0.005,
    premi: { 'Rintisan baru': 0.12, 'Berjalan kurang dari 1 tahun': 0.08, 'Berjalan 1 tahun atau lebih': 0.05 },
    horizon: { 'Rintisan baru': 3, 'Berjalan kurang dari 1 tahun': 3, 'Berjalan 1 tahun atau lebih': 5 },
    dTinggi: 0.05,
    dSangatTinggi: 0.10,
    kasMinBulan: 2,
    amortBulan: 24,
    pengali: { 'Puncak Terbesar': 2, 'Puncak Besar': 1.5, 'Puncak Sedang': 1.2, 'Baseline Harian': 1, 'Rawan Lesu': 0.7 }
  };

  function num(x, d) { return (typeof x === 'number' && isFinite(x)) ? x : (d === undefined ? 0 : d); }
  function isNum(x) { return typeof x === 'number' && isFinite(x); }
  function sumItems(a) { var s = 0; (a || []).forEach(function (i) { s += num(i && i.nilai); }); return s; }
  function arr(n, f) { var a = []; for (var i = 0; i < n; i++) a.push(f(i)); return a; }
  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function mergeRef(r) {
    var o = clone(DEF_REF);
    if (r) {
      Object.keys(r).forEach(function (k) {
        if (r[k] && typeof r[k] === 'object' && !Array.isArray(r[k])) o[k] = Object.assign({}, o[k], r[k]);
        else if (r[k] !== undefined) o[k] = r[k];
      });
    }
    if (!isNum(o.hargaNaik)) o.hargaNaik = o.inflasiUmum;
    return o;
  }

  function irr(flows) {
    var hasNeg = false, hasPos = false;
    flows.forEach(function (f) { if (f < 0) hasNeg = true; if (f > 0) hasPos = true; });
    if (!hasNeg || !hasPos) return null;
    function npv(r) { var s = 0; for (var t = 0; t < flows.length; t++) s += flows[t] / Math.pow(1 + r, t); return s; }
    var lo = -0.99, hi = 10, flo = npv(lo), fhi = npv(hi);
    if (flo * fhi > 0) return null;
    for (var i = 0; i < 200; i++) {
      var mid = (lo + hi) / 2, fm = npv(mid);
      if (Math.abs(fm) < 1e-9) return mid;
      if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
    }
    return (lo + hi) / 2;
  }

  function prepProduk(p, cfg, listrikVar, ref) {
    var q = { nama: p.nama || 'Produk', satuan: p.satuan || 'unit', mode: p.mode || 'unit' };
    q.tumbuh = num(p.tumbuh);
    q.kapasitas = num(p.kapasitas);
    var A = sumItems(p.hppA), B = sumItems(p.hppB), C = sumItems(p.hppC), D = sumItems(p.hppD);
    q.susutPct = num(p.susutPct);
    if (q.mode === 'omzet') {
      q.harga = 1; q.hargaAvg = 1; q.volume = num(p.omzet); q.kapasitas = 0; q.satuan = 'Rp';
      A = Math.max(0, 1 - num(p.margin)); B = 0; C = 0; D = 0;
    } else {
      var h = num(p.harga), hb = num(p.hargaBulk), pb = num(p.porsiBulk);
      q.harga = h;
      q.hargaAvg = (h > 0) ? ((hb > 0 && pb > 0) ? h * (1 - pb) + hb * pb : h) : 0;
      q.volume = num(p.volume);
    }
    A = A * (1 + q.susutPct);
    // biaya lain per unit
    (cfg.biayaLain || []).forEach(function (b) {
      if (b && b.jenis === 'unit' && num(b.nilai) > 0 && (b.produk === undefined || b.produk === 'semua' || b.produk === p._idx)) D += num(b.nilai);
    });
    if (q.mode !== 'batch' && q.mode !== 'omzet') D += listrikVar;
    q.A = A; q.B = B; q.C = C; q.D = D;
    q.hppUnit = A + B + C + D;
    q.hariStok = isNum(p.hariStok) ? p.hariStok : 30;
    if (q.mode === 'batch') {
      var b = p.batch || {};
      q.batch = {
        siklus: Math.max(1, Math.round(num(b.siklus, 1))),
        jumlah: Math.max(1, Math.round(num(b.jumlah, 1))),
        hasil: num(b.hasil),
        mati: num(b.matiPct),
        items: (b.biaya || []).map(function (i) { return { nama: i.nama, nilai: num(i.nilai), tahap: i.tahap === 'awal' ? 'awal' : 'rutin' }; })
      };
      // biaya lain per batch
      (cfg.biayaLain || []).forEach(function (bl) {
        if (bl && bl.jenis === 'batch' && num(bl.nilai) > 0 && (bl.produk === undefined || bl.produk === 'semua' || bl.produk === p._idx)) q.batch.items.push({ nama: bl.nama, nilai: num(bl.nilai), tahap: 'rutin' });
      });
      q.batch.hasilNet = q.batch.hasil * (1 - q.batch.mati);
      q.batch.biayaTotal = sumItems(q.batch.items);
      q.batch.biayaAwal = sumItems(q.batch.items.filter(function (i) { return i.tahap === 'awal'; }));
      q.batch.biayaRutin = q.batch.biayaTotal - q.batch.biayaAwal;
      q.harga = num(p.harga);
      q.hargaAvg = q.harga;
      q.volume = q.batch.hasilNet * q.batch.jumlah / q.batch.siklus;
      q.hppUnit = q.batch.hasilNet > 0 ? q.batch.biayaTotal / q.batch.hasilNet : 0;
      q.A = q.hppUnit; q.B = 0; q.C = 0; q.D = 0;
      q.kapasitas = 0;
      q.starts = [];
      for (var k = 0; k < q.batch.jumlah; k++) {
        var s0 = 1 + Math.round(k * q.batch.siklus / q.batch.jumlah);
        for (var s = s0; s <= 60; s += q.batch.siklus) q.starts.push(s);
      }
    }
    return q;
  }

  function listrikCalc(l, volDasar) {
    var o = { varUnit: 0, tetap: 0 };
    if (!l || !l.aktif) return o;
    if (l.metode === 'B') {
      var est = num(l.daya) / 1000 * num(l.jam) * num(l.hari) * num(l.tarif);
      o.varUnit = volDasar > 0 ? est / volDasar : 0;
      o.tetap = num(l.tetapLain);
      o.estimasi = est;
    } else {
      var v = (num(l.ramaiVol) > num(l.sepiVol) && num(l.ramaiTagihan) >= num(l.sepiTagihan)) ? (num(l.ramaiTagihan) - num(l.sepiTagihan)) / (num(l.ramaiVol) - num(l.sepiVol)) : 0;
      var t = Math.max(0, num(l.sepiTagihan) - v * num(l.sepiVol));
      var porsi = isNum(l.porsiA) ? l.porsiA : 1;
      o.varUnit = porsi * v; o.tetap = porsi * t;
    }
    return o;
  }

  function musimMultipliers(cfg, ref) {
    var m = cfg.musim || {};
    var out = { aktif: !!m.aktif, raw: [], norm: [], start: 1, mult: arr(12, function () { return 1; }), avg: 1 };
    var tingkat = m.tingkat || arr(12, function () { return 'Baseline Harian'; });
    out.raw = tingkat.slice(0, 12).map(function (t) { return isNum(ref.pengali[t]) ? ref.pengali[t] : 1; });
    while (out.raw.length < 12) out.raw.push(1);
    var avg = sum(out.raw) / 12;
    out.norm = out.raw.map(function (x) { return x / avg; });
    out.avg = sum(out.norm) / 12;
    out.start = Math.min(12, Math.max(1, Math.round(num(m.periodeAwal, 1))));
    if (out.aktif) out.mult = arr(12, function (i) { return out.norm[(out.start - 1 + i) % 12]; });
    return out;
  }

  function pembiayaanSchedule(p) {
    var o = { dana: 0, angsuran: arr(61, function () { return 0; }), beban: arr(61, function () { return 0; }), tenor: 0, jenis: (p && p.jenis) || 'Tidak ada' };
    if (!p || !p.jenis || p.jenis === 'Tidak ada') return o;
    var T = Math.round(num(p.tenor));
    o.tenor = T;
    if (T <= 0) return o;
    var m;
    if (p.jenis === 'Murabahah') {
      var ang = (num(p.hargaBeli) + num(p.margin)) / T, bb = num(p.margin) / T;
      o.dana = num(p.hargaBeli);
      for (m = 1; m <= Math.min(T, 60); m++) { o.angsuran[m] = ang; o.beban[m] = bb; }
    } else if (p.jenis === 'Ijarah') {
      for (m = 1; m <= Math.min(T, 60); m++) { o.angsuran[m] = num(p.sewa); o.beban[m] = num(p.sewa); }
    } else if (p.jenis === 'Pinjaman flat') {
      var P = num(p.pokok), mg = P * num(p.bungaTahunan) * T / 12;
      o.dana = P;
      for (m = 1; m <= Math.min(T, 60); m++) { o.angsuran[m] = (P + mg) / T; o.beban[m] = mg / T; }
    } else if (p.jenis === 'Pinjaman anuitas') {
      var P2 = num(p.pokok), r = num(p.bungaTahunan) / 12;
      o.dana = P2;
      var pmt = r > 0 ? P2 * r / (1 - Math.pow(1 + r, -T)) : P2 / T, os = P2;
      for (m = 1; m <= Math.min(T, 60); m++) { var bunga = os * r; o.angsuran[m] = pmt; o.beban[m] = bunga; os -= (pmt - bunga); }
    }
    return o;
  }

  function compute(cfgIn) {
    var cfg = clone(cfgIn);
    var ref = mergeRef(cfg.ref);
    var prof = cfg.profil || {};
    var status = prof.status || 'Berjalan 1 tahun atau lebih';
    var tarifPajak = isNum(cfg.tarifPajak) ? cfg.tarifPajak : ref.pph;
    var inflB = isNum(cfg.inflasiBahan) ? cfg.inflasiBahan : (prof.pangan ? ref.inflasiPangan : ref.inflasiUmum);
    var inflO = ref.inflasiUmum, hNaik = ref.hargaNaik;
    var porsiTunai = isNum(cfg.porsiTunai) ? cfg.porsiTunai : 1;
    var kasAwal = num(cfg.kasAwal);
    var cek = [];

    (cfg.produk || []).forEach(function (p, i) { p._idx = i; });
    var volUnitTotal = 0;
    (cfg.produk || []).forEach(function (p) { if ((p.mode || 'unit') === 'unit') volUnitTotal += num(p.volume); });
    var lis = listrikCalc(cfg.listrik, volUnitTotal);
    var produk = (cfg.produk || []).map(function (p) { return prepProduk(p, cfg, lis.varUnit, ref); });
    var np = produk.length;

    // biaya tetap
    var fixItems = (cfg.biayaTetap || []).map(function (b) { return { nama: b.nama, nilai: num(b.nilai) }; });
    var tetapLain = 0;
    (cfg.biayaLain || []).forEach(function (b) { if (b && b.jenis === 'tetap' && num(b.nilai) > 0) tetapLain += num(b.nilai); });
    var F0 = sum(fixItems.map(function (x) { return x.nilai; })) + lis.tetap + tetapLain;

    // modal dan investasi
    var modal = cfg.modal || {};
    var aset = (modal.aset || []).map(function (a) { var u = num(a.umur); return { nama: a.nama, nilai: num(a.nilai), umur: u, susut: (u > 0 ? num(a.nilai) / u : 0) }; });
    var invest = sum(aset.map(function (a) { return a.nilai; }));
    var depMonthly = sum(aset.map(function (a) { return a.susut; }));
    var legalitas = num(modal.legalitas), pemasaranAwal = num(modal.pemasaranAwal);
    var amort = legalitas > 0 ? legalitas / ref.amortBulan : 0;
    var lainKerja = sumItems(modal.lainKerja);
    var stokAwal = 0;
    produk.forEach(function (q) { stokAwal += q.hppUnit * q.volume * (q.hariStok === undefined ? 30 : q.hariStok) / 30; });
    var kasMin = F0 * ref.kasMinBulan;
    var modalKerja = stokAwal + F0 + pemasaranAwal + kasMin + legalitas + lainKerja;
    var kebutuhan = modalKerja + invest;
    var capex1 = invest + pemasaranAwal + legalitas + lainKerja;
    var umurUtama = 0, maxNilai = 0;
    aset.forEach(function (a) { if (a.nilai > maxNilai) { maxNilai = a.nilai; umurUtama = a.umur; } });

    var fin = pembiayaanSchedule(cfg.pembiayaan);
    var ziswaf = num(modal.ziswaf), lainnya = num(modal.lainnya);
    var internal = kebutuhan - fin.dana - ziswaf - lainnya;
    var sumberMod = { internal: internal, eksternal: fin.dana, ziswaf: ziswaf, lainnya: lainnya, total: internal + fin.dana + ziswaf + lainnya };

    var must = musimMultipliers(cfg, ref);
    var M = 12;

    // akad
    var akad = cfg.akad || {};
    var akadJenis = akad.jenis || 'Dikelola langsung';
    var wakaf = isNum(akad.nisbahWakaf) ? akad.nisbahWakaf : 0;
    var nisPemilik = (akadJenis === 'Dikelola langsung' || akadJenis === 'Tanpa distribusi') ? 1 - wakaf : (isNum(akad.nisbahPemilik) ? akad.nisbahPemilik : 1 - wakaf);
    var nisPengelola = Math.max(0, 1 - nisPemilik - wakaf);
    var porsiModal = isNum(akad.porsiModal) ? akad.porsiModal : null;
    var frek = akad.frekuensi || 'Tahunan';

    var bln = arr(M, function (i) { return i + 1; });
    var vol = produk.map(function () { return arr(M, function () { return 0; }); });
    var price = produk.map(function () { return arr(M, function () { return 0; }); });
    var revP = produk.map(function () { return arr(M, function () { return 0; }); });
    var costP = produk.map(function () { return arr(M, function () { return 0; }); });
    var cashCostP = produk.map(function () { return arr(M, function () { return 0; }); });

    produk.forEach(function (q, i) {
      for (var m = 1; m <= M; m++) {
        var esc1 = Math.pow(1 + inflB, (m - 1) / 12), esc2 = Math.pow(1 + inflO, (m - 1) / 12);
        var pr = q.hargaAvg * Math.pow(1 + hNaik, (m - 1) / 12);
        if (q.mode === 'batch') {
          var harvest = 0, cashC = 0;
          q.starts.forEach(function (s) {
            var end = s + q.batch.siklus - 1;
            if (end === m) harvest += 1;
            if (s <= m && m <= end) cashC += q.batch.biayaRutin / q.batch.siklus;
            if (s === m) cashC += q.batch.biayaAwal;
          });
          var v = harvest * q.batch.hasilNet;
          vol[i][m - 1] = v;
          price[i][m - 1] = pr * must.mult[m - 1];
          revP[i][m - 1] = v * price[i][m - 1];
          costP[i][m - 1] = harvest * q.batch.biayaTotal * esc2;
          cashCostP[i][m - 1] = cashC * esc2;
        } else {
          var v0 = q.volume * Math.pow(1 + q.tumbuh, m - 1) * must.mult[m - 1];
          var v1 = q.kapasitas > 0 ? Math.min(v0, q.kapasitas) : v0;
          vol[i][m - 1] = v1;
          price[i][m - 1] = pr;
          revP[i][m - 1] = v1 * pr;
          var hu = q.A * esc1 + (q.B + q.C + q.D) * esc2;
          costP[i][m - 1] = v1 * hu;
          cashCostP[i][m - 1] = costP[i][m - 1];
        }
      }
    });

    // biaya variabel persen omzet
    var pctItems = (cfg.biayaLain || []).filter(function (b) { return b && b.jenis === 'persen' && num(b.nilai) > 0; });
    var pctCost = arr(M, function (m) {
      var s = 0;
      pctItems.forEach(function (b) {
        if (b.produk === undefined || b.produk === 'semua') {
          var rv = 0; produk.forEach(function (_, i) { rv += revP[i][m]; }); s += rv * num(b.nilai);
        } else if (revP[b.produk]) s += revP[b.produk][m] * num(b.nilai);
      });
      return s;
    });

    var L = {};
    L.mult = must.mult.slice();
    L.volume = arr(M, function (m) { var s = 0; produk.forEach(function (_, i) { s += vol[i][m]; }); return s; });
    L.pendapatan = arr(M, function (m) { var s = 0; produk.forEach(function (_, i) { s += revP[i][m]; }); return s; });
    L.hpp = arr(M, function (m) { var s = 0; produk.forEach(function (_, i) { s += costP[i][m]; }); return s; });
    L.labaKotor = arr(M, function (m) { return L.pendapatan[m] - L.hpp[m]; });
    L.biayaVarPct = pctCost;
    L.biayaTetap = arr(M, function (m) { return F0 * Math.pow(1 + inflO, m / 12); });
    L.penyusutan = arr(M, function (m) {
      var mm = m + 1, s = 0;
      aset.forEach(function (a) { if (a.umur >= mm) s += a.susut; });
      return s + (mm <= ref.amortBulan ? amort : 0);
    });
    L.ebit = arr(M, function (m) { return L.labaKotor[m] - L.biayaVarPct[m] - L.biayaTetap[m] - L.penyusutan[m]; });
    L.bebanPembiayaan = arr(M, function (m) { return fin.tenor > 0 && m + 1 <= fin.tenor ? fin.beban[m + 1] : 0; });
    L.lsp = arr(M, function (m) { return L.ebit[m] - L.bebanPembiayaan[m]; });
    L.pajak = arr(M, function (m) { return L.pendapatan[m] * tarifPajak; });
    L.labaBersih = arr(M, function (m) { return L.lsp[m] - L.pajak[m]; });
    L.marginKotor = arr(M, function (m) { return L.pendapatan[m] === 0 ? 0 : L.labaKotor[m] / L.pendapatan[m]; });
    L.marginBersih = arr(M, function (m) { return L.pendapatan[m] === 0 ? 0 : L.labaBersih[m] / L.pendapatan[m]; });
    L.bagiPemilik = arr(M, function (m) {
      var x = L.labaBersih[m];
      if (akadJenis === 'Musyarakah') return x >= 0 ? x * nisPemilik : x * (porsiModal !== null ? porsiModal : nisPemilik);
      return x >= 0 ? x * nisPemilik : x;
    });
    L.bagiPengelola = arr(M, function (m) {
      var x = L.labaBersih[m];
      if (akadJenis === 'Musyarakah') return x >= 0 ? x * nisPengelola : x * (1 - (porsiModal !== null ? porsiModal : nisPemilik));
      return x >= 0 ? x * nisPengelola : 0;
    });
    L.bagiWakaf = arr(M, function (m) { return L.labaBersih[m] >= 0 ? L.labaBersih[m] * wakaf : 0; });
    L.cekAlokasi = arr(M, function (m) { return Math.round((L.bagiPemilik[m] + L.bagiPengelola[m] + L.bagiWakaf[m] - L.labaBersih[m]) * 100) / 100; });

    // arus kas
    function payout(row) {
      return arr(M, function (m) {
        var mm = m + 1;
        if (akadJenis === 'Tanpa distribusi') return 0;
        if (frek === 'Bulanan') return Math.max(0, row[m]);
        if (frek === 'Triwulanan') return mm % 3 === 0 ? Math.max(0, row[m] + row[m - 1] + row[m - 2]) : 0;
        return mm === 12 ? Math.max(0, sum(row)) : 0;
      });
    }
    var kejadian = cfg.kejadian || [];
    function ev(jenis, mm) { var s = 0; kejadian.forEach(function (e) { if (e && Math.round(num(e.bulan)) === mm && e.jenis === jenis) s += num(e.jumlah); }); return s; }
    var C = {};
    C.penjualanTunai = L.pendapatan.map(function (x) { return x * porsiTunai; });
    C.piutang = arr(M, function (m) { return m === 0 ? 0 : L.pendapatan[m - 1] * (1 - porsiTunai); });
    C.modalMasuk = arr(M, function (m) { return m === 0 ? sumberMod.total : 0; });
    C.masukLain = arr(M, function (m) { return ev('Kas masuk', m + 1); });
    C.totalMasuk = arr(M, function (m) { return C.penjualanTunai[m] + C.piutang[m] + C.modalMasuk[m] + C.masukLain[m]; });
    C.bahan = arr(M, function (m) { var s = 0; produk.forEach(function (_, i) { s += cashCostP[i][m]; }); return s; });
    C.tetap = L.biayaTetap.slice();
    C.varPct = pctCost.slice();
    C.angsuran = arr(M, function (m) { return fin.tenor > 0 && m + 1 <= fin.tenor ? fin.angsuran[m + 1] : 0; });
    C.pajak = L.pajak.slice();
    C.bhPemilik = payout(L.bagiPemilik);
